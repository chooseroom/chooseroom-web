<svg width="185" height="40" viewBox="0 0 185 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Minimalist Clean Bed Emblem (Light Mode / Default) -->
  <g transform="translate(2, 2)">
    <!-- Container Squircle -->
    <rect width="36" height="36" rx="9" fill="#082319"/>
    <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="8.25" stroke="#174A37" stroke-width="1.5"/>

    <!-- Headboard Pillar -->
    <rect x="7" y="9" width="3.2" height="18" rx="1.6" fill="#10B981"/>

    <!-- Base Frame Rail -->
    <rect x="7" y="21" width="22" height="3.2" rx="0.8" fill="#10B981"/>

    <!-- Footboard Leg -->
    <rect x="26" y="21" width="2.8" height="6" rx="1.2" fill="#10B981"/>

    <!-- Soft Curved Pillow -->
    <path d="M10.2 18C10.2 13.8 13.8 12.8 16.8 13.8C18 14.3 18.5 16 18 18H10.2Z" fill="#FFFFFF"/>

    <!-- Clean Mattress Cushion -->
    <rect x="10.2" y="17.2" width="16.8" height="4.2" rx="1.6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark Text: "Choose Bed" -->
  <text x="48" y="26" font-family="'Inter', 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" letter-spacing="-0.025em">
    <tspan fill="#0B2B20">Choose </tspan>
    <tspan fill="#10B981">Bed</tspan>
  </text>
</svg>
